name: Refresh UW job listings

# UW's Workday API has no CORS headers, so the deployed site can't call it
# directly (see JobMarketBackend.md §3) — this runs the fetch server-side
# instead, and commits the result as data/uw-jobs.json for the site to read at
# runtime via raw.githubusercontent.com.
#
# MANUAL ONLY as of 2026-08-13 (David). The daily 6am Pacific schedule was
# removed: the Job Market Explorer board it feeds is currently unlinked from the
# site, so the job was refreshing data nothing reads and putting an automated
# commit on main for it. The workflow itself is kept, and `workflow_dispatch`
# still runs it on demand from the Actions tab or the GitHub API, so the data
# can be brought current whenever the board comes back — restore the schedule
# then, alongside whatever wider refresh story it ends up part of.
#
#  schedule:
#    - cron: '0 13 * * *' # ~6am Pacific (7am during PDT) daily
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch current UW listings
        run: node scripts/refresh-uw-jobs.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/uw-jobs.json; then
            echo "No changes to UW listings."
          else
            git add data/uw-jobs.json
            git commit -m "Refresh UW job listings [automated]"
            git push
          fi
